# Publishes the release artifacts to Maven Central when a version tag is pushed.
#
# It runs alongside the GitHub release workflow, which reacts to the same tags, and does not depend
# on it. The deploy uses the "release" profile of the POM, the same one used for a deploy from a
# developer machine.
#
# Maven Central does not allow a published version to be removed or replaced, so the tag and the
# version in the parent POM, which the modules inherit, are checked before anything is built. If
# that check fails nothing is published.
name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

# Narrowed to what the build requires. Every dependency comes from Maven Central or the Shibboleth
# repository, so nothing more than reading the repository is needed.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # setup-java writes a settings.xml holding the github server alone, which this build does not
      # use. Publishing needs the central server, so the file is replaced here. The values are
      # environment references, so no secret is written to the file or shown in the log.
      - name: Configure the Maven servers
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      # Nothing has been built at this point, so a tag that does not match publishes nothing. The
      # tag must be "v" followed by the POM version, and that version must not be a snapshot.
      - name: Check that the tag matches the Maven version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(mvn -q --no-transfer-progress -N help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "Tag: ${TAG}, POM version: ${VERSION}"
          if [ "${VERSION%-SNAPSHOT}" != "${VERSION}" ]; then
            echo "::error::The POM version is the snapshot ${VERSION}, set the release version before tagging"
            exit 1
          fi
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::The POM version is ${VERSION}, but the tag ${TAG} requires ${TAG#v}"
            exit 1
          fi

      # A full build, tests included, and then the deploy. Signing uses the Bouncy Castle signer of
      # the Maven GPG plugin, which takes the key and its passphrase from the environment, so the
      # runner needs no gpg executable and no key import. Selecting it on the command line leaves
      # the release profile usable as it is from a developer machine.
      - name: Build and deploy to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.BOT_GPG_PASSWORD }}
        run: mvn -Prelease clean deploy -Dgpg.signer=bc --no-transfer-progress
